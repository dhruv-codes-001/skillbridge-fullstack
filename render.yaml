services:
  - type: web
    name: skillbridge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: COOKIE_SECURE
        value: "True"
      - key: COOKIE_SAMESITE
        value: "none"
